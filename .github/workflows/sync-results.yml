# Holt die aktuellen WM-Ergebnisse und schreibt sie in die Supabase-Datenbank.
# Benötigte Repository-Secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL               URL des Supabase-Projekts
#   SUPABASE_SERVICE_ROLE_KEY  Service-Role-Key des Projekts
#   FOOTBALL_DATA_API_KEY      optional – für Live-Ergebnisse von football-data.org
name: Ergebnisse synchronisieren

on:
  schedule:
    # Alle 5 Minuten (kürzester von GitHub erlaubter Abstand; Cron-Jobs laufen
    # teils mit etwas Verzögerung). So sind Live-Ergebnisse möglichst frisch.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: sync-results
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Ergebnisse nach Supabase synchronisieren
        run: node scripts/sync-supabase.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
